version: 2

sources:
  - name: raw
    description: Raw OpenAQ observations loaded by the Python ingestion pipeline.
    schema: raw
    tables:
      - name: openaq_measurements
        description: One row per sensor, pollutant, and UTC measurement timestamp.
        loaded_at_field: ingested_at
        columns:
          - name: observation_id
            data_tests:
              - not_null
              - unique
          - name: location_id
            data_tests:
              - not_null
          - name: sensor_id
            data_tests:
              - not_null
          - name: parameter
            data_tests:
              - not_null
          - name: value
            data_tests:
              - not_null
          - name: measured_at
            data_tests:
              - not_null
