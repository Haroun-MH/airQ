[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airq"
version = "0.1.0"
description = "A reliable, observable multi-city air-quality data pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.32,<2.34",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
docker = [
  "duckdb>=1.1,<2.0",
  "dbt-duckdb>=1.9,<1.12",
  "datacontract-cli[duckdb]>=1.0,<1.3",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
  "pandas>=2.2,<3.0",
  "pandera[pandas]>=0.24,<0.37",
  "duckdb>=1.1,<2.0",
  "dbt-duckdb>=1.9,<1.12",
  "datacontract-cli[duckdb]>=1.0,<1.3",
]

[tool.setuptools]
packages = ["airq"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
